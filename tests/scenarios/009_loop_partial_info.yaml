id: "009"
title: "재요청 루프 — 부분 정보 반복 (3회+)"
intent: "사용자가 매 턴 일부씩만 제공할 때 [수신 완료]/[아직 필요]/[재요청 수집 SQL] 3섹션이 정확한 헤더로 반복 출력되는지 검증"
db_version: "19c"

input_sql: |
  SELECT o.order_id, c.customer_name, o.total_amount
  FROM   orders o, customers c
  WHERE  o.customer_id = c.customer_id
    AND  o.order_date >= :B1
    AND  o.status      = :B2
  ORDER BY o.order_date DESC;

user_turns:
  - turn: 1
    message: |
      위 SQL 튜닝해 주세요.
    expected:
      must_request:
        - "DB 버전"
        - "ORDERS"
        - "CUSTOMERS"
        - "테이블 통계"
        - "인덱스"
      forbidden_phrases:
        - "경험상"
        - "일반적으로"

  - turn: 2
    message: |
      DB 버전만 먼저 드릴게요.
      - DB 버전: Oracle 19c
    expected:
      must_include_section:
        - "[수신 완료]"
        - "[아직 필요]"
        - "[재요청 수집 SQL]"
      must_include_phrase:
        - "ORDERS"
        - "CUSTOMERS"
      forbidden_phrases:
        - "경험상"
        - "일반적으로"

  - turn: 3
    message: |
      테이블 통계만 추가로 드릴게요.
      - ORDERS NUM_ROWS=1억, LAST_ANALYZED=5일 전
      - CUSTOMERS NUM_ROWS=500만, LAST_ANALYZED=5일 전
    expected:
      must_include_section:
        - "[수신 완료]"
        - "[아직 필요]"
        - "[재요청 수집 SQL]"
      must_include_phrase:
        - "인덱스"
      forbidden_phrases:
        - "경험상"
        - "일반적으로"

  - turn: 4
    message: |
      나머지 정보 한 번에 드립니다.
      - 인덱스: ORDERS PK + IDX_ORDERS_CUSTOMER(CUSTOMER_ID). ORDER_DATE/STATUS 결합 인덱스 없음
      - ORDER_DATE NDV=730, STATUS NDV=5, 둘 다 HISTOGRAM=NONE
      - 바인드 :B1='2026-04-01', :B2='SHIPPED', 카디널리티 1.2M
      - 실행 계획: ORDERS TABLE ACCESS FULL, A-Time 56초
    expected:
      must_include_section:
        - "[진단 요약]"
        - "[가설]"
        - "[튜닝 대안]"
        - "[튜닝된 SQL — 권장안 기준]"
        - "[검증 방법]"
      forbidden_phrases:
        - "경험상"
        - "일반적으로"
        - "보통은"

pass_criteria:
  - all_must_request_satisfied
  - loop_sections_present_each_turn
  - all_must_include_section_present_final_turn
  - no_forbidden_phrases
